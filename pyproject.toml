[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rabtech-cli-diagnostics"
version = "0.1.0"
description = "A CLI tool for developer environment diagnostics"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
diagnose = "diagnostics.cli:main"

[tool.setuptools.packages.find]
where = ["src"]